<text x="173.0" y="740" text-anchor="middle" font-size="11" fill="#6b645a">role chains, repair retry, circuit breaker,</text>
<text x="173.0" y="754" text-anchor="middle" font-size="11" fill="#6b645a">decision gates (Jev, Mercury, Gemma), student</text>
<text x="173.0" y="768" text-anchor="middle" font-size="11" fill="#6b645a">data never to Mercury</text>
<rect x="318" y="698" width="230" height="84" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="433.0" y="724" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">ToolRunner</text>
<text x="433.0" y="740" text-anchor="middle" font-size="11" fill="#6b645a">web, YouTube, Wikipedia, Commons,</text>
<text x="433.0" y="754" text-anchor="middle" font-size="11" fill="#6b645a">Openverse, Open Library, Codeforces;</text>
<text x="433.0" y="768" text-anchor="middle" font-size="11" fill="#6b645a">budgets and chaos switch</text>

<text x="270.0" y="102.0" font-size="11" fill="#6b645a">goal</text>
<path d="M530 106 L600 106" stroke="#1f1b16" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="571.0" y="102.0" font-size="11" fill="#6b645a">jobs</text>
<path d="M830 106 L900 106" stroke="#1f1b16" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="871.0" y="102.0" font-size="11" fill="#6b645a">decisions</text>

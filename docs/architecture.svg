<text x="657.0" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Source pack + Indra OCR</text>
<text x="657.0" y="226" text-anchor="middle" font-size="11" fill="#6b645a">offline tiers A and B, vision tier C</text>
<rect x="814" y="184" width="254" height="56" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="941.0" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Local OCR only</text>
<text x="941.0" y="226" text-anchor="middle" font-size="11" fill="#6b645a">no page image leaves the server</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" font-family="Hanken Grotesk, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Aasaan architecture: browser, API, worker, four layers of agents, model router, tools and SQLite">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1b16"/></marker></defs>
<rect width="1120" height="820" fill="#faf8f3"/>
<text x="28" y="38" font-size="22" font-weight="700" fill="#1f1b16">Aasaan architecture</text>
<text x="28" y="58" font-size="12" fill="#6b645a">solid = live in the real build flow   |   dashed = built, off by default or not wired in yet</text>
<rect x="28" y="78" width="200" height="56" rx="10" fill="#f0ece2" stroke="#1f1b16" stroke-width="1.5"/>
<text x="128.0" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Learner (browser)</text>
<text x="128.0" y="120" text-anchor="middle" font-size="11" fill="#6b645a">plain JS, no build step</text>
<rect x="300" y="78" width="230" height="56" rx="10" fill="#f0ece2" stroke="#1f1b16" stroke-width="1.5"/>
<text x="415.0" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">FastAPI</text>
<text x="415.0" y="120" text-anchor="middle" font-size="11" fill="#6b645a">REST + server-sent events</text>
<rect x="600" y="78" width="230" height="56" rx="10" fill="#f0ece2" stroke="#1f1b16" stroke-width="1.5"/>
<text x="715.0" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Worker + job queue</text>
<text x="715.0" y="120" text-anchor="middle" font-size="11" fill="#6b645a">2 lanes, retries, resumes after restart</text>
<rect x="900" y="78" width="190" height="56" rx="10" fill="#f0ece2" stroke="#1f1b16" stroke-width="1.5"/>
<text x="995.0" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Activity feed</text>
<text x="995.0" y="120" text-anchor="middle" font-size="11" fill="#6b645a">decision records, live</text>

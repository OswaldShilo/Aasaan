<text x="943.0" y="740" text-anchor="middle" font-size="11" fill="#6b645a">claims, leases, hop and revision limits, kill switch</text>
<text x="943.0" y="754" text-anchor="middle" font-size="11" fill="#6b645a">AASAAN_ORCHESTRATOR (shadow mode,</text>

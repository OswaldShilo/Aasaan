<text x="153.0" y="226" text-anchor="middle" font-size="11" fill="#6b645a">text, PDFs, photos, links</text>
<rect x="290" y="184" width="210" height="56" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="395.0" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Scoper (gate)</text>

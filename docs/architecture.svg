<rect x="258" y="398" width="160" height="60" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="338.0" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Critic</text>
<text x="338.0" y="442" text-anchor="middle" font-size="11" fill="#6b645a">Verified N of M, max 2 loops</text>

<text x="668.0" y="612" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Companion</text>
<text x="668.0" y="628" text-anchor="middle" font-size="11" fill="#6b645a">greeting, 5-minute review</text>
<rect x="768" y="586" width="170" height="56" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="853.0" y="612" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Doubt answerer</text>
<text x="853.0" y="628" text-anchor="middle" font-size="11" fill="#6b645a">Guide me, quotes, [n]</text>

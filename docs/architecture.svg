<text x="198.0" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Architect</text>
<text x="198.0" y="332" text-anchor="middle" font-size="11" fill="#6b645a">8 to 20 chapters, prerequisite DAG, coverage map</text>
<rect x="380" y="290" width="330" height="56" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="545.0" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Curator</text>
<text x="545.0" y="332" text-anchor="middle" font-size="11" fill="#6b645a">verified links, videos, images, books</text>
<rect x="742" y="290" width="326" height="56" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="905.0" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Book sources</text>
<text x="905.0" y="332" text-anchor="middle" font-size="11" fill="#6b645a">Open Library, cited as [n] in chat</text>

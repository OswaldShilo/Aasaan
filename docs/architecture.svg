<text x="538.0" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Quizzer</text>
<text x="538.0" y="442" text-anchor="middle" font-size="11" fill="#6b645a">4 question types</text>
<rect x="638" y="398" width="140" height="60" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="708.0" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Illustrator</text>
<text x="708.0" y="434" text-anchor="middle" font-size="11" fill="#6b645a">diagrams, code</text>
<text x="708.0" y="448" text-anchor="middle" font-size="11" fill="#6b645a">flowcharts</text>
<rect x="808" y="398" width="120" height="60" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="868.0" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Slides</text>
<text x="868.0" y="442" text-anchor="middle" font-size="11" fill="#6b645a">typed deck</text>
<rect x="958" y="398" width="110" height="60" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="1013.0" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Practice</text>
<text x="1013.0" y="434" text-anchor="middle" font-size="11" fill="#6b645a">Codeforces,</text>
<text x="1013.0" y="448" text-anchor="middle" font-size="11" fill="#6b645a">exams</text>
<rect x="48" y="478" width="1020" height="52" rx="10" fill="#f4faf6" stroke="#9bb8a3" stroke-width="1.5"/>
<text x="558.0" y="508" text-anchor="middle" font-size="12" font-weight="400" fill="#1f1b16">Release: notes first, then quiz, visuals and slides fill in. A step that fails leaves a quiet placeholder, never a stuck chapter.</text>
<rect x="28" y="562" width="1062" height="92" rx="14" fill="#f6ece6" stroke="none"/>
<text x="44" y="584" font-size="12" font-weight="700" letter-spacing="1" fill="#6b645a">LAYER 4 / THE LEARNER'S HELPERS (proposals use Apply and Undo)</text>
<rect x="48" y="586" width="160" height="56" rx="10" fill="#fff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="128.0" y="612" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1b16">Diagnoser</text>
<text x="128.0" y="628" text-anchor="middle" font-size="11" fill="#6b645a">code grades first</text>

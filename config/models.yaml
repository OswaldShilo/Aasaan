# Aasaan model router config. Agents ask for a ROLE; the router walks the chain in order.
# Policy: writers use the fast model, planners and checkers use the strongest, the Critic is a
# different model from the Teacher where possible.
# Failure = timeout, rate limit, malformed output, failed schema/rule check, missing key.
# Every fallback is logged with its reason (events table + server log). GET /api/health/models
# calls each model once so a wrong id is visible immediately instead of silently falling back.

providers:
  gemini_api:                 # Gemma 4 via Google AI Studio. ONLY gemma-4-26b-a4b-it and gemma-4-31b-it are served here.
    api_key_env: GEMINI_API_KEY
  sarvam:                     # https://api.sarvam.ai (chat /v2/chat/completions, speech, translate)
    api_key_env: SARVAM_API_KEY
    tts_speaker: ""           # optional Bulbul speaker name; empty = API default (set if TTS health check fails)
  typesafe:                   # Jev: a DECISION model (typed answers), not a chat model
    api_key_env: TYPESAFE_API_KEY
    base_url: https://api.typesafe.ai
  openrouter:                 # extra Gemma 4 fallback AND a second route to the decision models (same System One schema)
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
  ollama:                     # optional offline mode only (small Gemma sizes are local-only)
    base_url: http://localhost:11434

defaults:
  timeout_s: 30
  max_retries_per_model: 1
  log_events: true
  max_concurrent_calls: 4   # global limit on simultaneous model calls (AASAAN_MAX_CALLS overrides)
  cache_calls: true         # cache validated model replies by input hash
  circuit_threshold: 2      # consecutive timeouts/5xx before a model is skipped...
  circuit_cooldown_s: 90    # ...for this long (then retried)
  slow_call_s: 40           # answering slower than this counts like a failure for the breaker; the startup check demotes such models

models:
  # thinking_level: Gemma 4 reasons before answering; "minimal" is far faster and enough for structured JSON tasks
  gemma_31b:     { provider: gemini_api, kind: chat, id: gemma-4-31b-it, thinking_level: minimal }      # strongest: planning, checking, vision
  gemma_26b:     { provider: gemini_api, kind: chat, id: gemma-4-26b-a4b-it, thinking_level: minimal }  # fast: bulk writing
  or_gemma_31b:  { provider: openrouter, kind: chat, id: google/gemma-4-31b-it }
  or_gemma_26b:  { provider: openrouter, kind: chat, id: google/gemma-4-26b-a4b-it }
  gemini_flash:  { provider: gemini_api, kind: chat, id: gemini-3.8-flash, thinking_level: minimal }   # resource pulling, tool use, long context (AI Studio free tier)
  or_xing:       { provider: openrouter, kind: chat, id: "xingchen-agi/xing4.0-29b-a4b:free" }       # free; planning + tool calling; Gemini quota fallback
  or_laguna:     { provider: openrouter, kind: chat, id: "poolside/laguna-s-2.1:free" }              # free; coding-tuned, for code-heavy chapters
  sarvam_gemma4: { provider: sarvam,     kind: chat, id: gemma4 }                # Gemma 4 31B on Sarvam (beta), image capable
  sarvam_105b:   { provider: sarvam,     kind: chat, id: sarvam-105b }           # Indian-language reasoning
  # Decision models: typed answers (choice, score, yes/no probability), never generated text. Chain: see roles.decisions.
  jev:           { provider: typesafe,   kind: decision, id: jev-latest }                    # TYPESAFE_API_KEY (preferred)
  jev_or:        { provider: openrouter, kind: decision, id: "typesafe/jev-1.13" }           # Jev through OPENROUTER_API_KEY
  mercury_decide: { provider: openrouter, kind: decision, id: "inception/mercury-decide:free", free_tier: true }  # best effort; no student data
  sarvam_stt:    { provider: sarvam,     kind: stt,       id: "saaras:v4" }      # docs: current default
  sarvam_stt_v3: { provider: sarvam,     kind: stt,       id: "saaras:v3" }      # legacy, still available
  sarvam_tts:    { provider: sarvam,     kind: tts,       id: "bulbul:v4-flash" }  # docs: latest
  sarvam_tts_v3: { provider: sarvam,     kind: tts,       id: "bulbul:v3" }
  sarvam_tr:     { provider: sarvam,     kind: translate, id: "mayura:v1" }
  gemma_local:   { provider: ollama,     kind: chat, id: "gemma4:e4b", optional: true }   # offline mode only

roles:
  intake:        { chain: [gemma_31b, gemma_26b, or_gemma_31b, sarvam_gemma4, text_only], timeout_s: 45 }
  architect:     { chain: [gemma_31b, gemma_26b, or_gemma_31b, or_xing, sarvam_gemma4, linear_path], timeout_s: 45 }
  curator:       { chain: [gemini_flash, gemma_26b, or_xing, or_gemma_26b, search_order], timeout_s: 20 }   # Gemma relevance list when every decision provider failed
  teacher:       { chain: [gemma_26b, gemma_31b, or_gemma_26b, or_laguna, gemini_flash, sarvam_gemma4, cached_lesson], timeout_s: 45 }
  teacher_indic: { chain: [sarvam_105b, gemma_31b, cached_lesson] }
  slides:        { chain: [gemma_26b, gemma_31b, or_gemma_26b, cached_lesson], timeout_s: 45 }   # the slide deck, written after the notes are final
  critic:        { chain: [gemma_31b, gemma_26b, or_gemma_31b, sarvam_gemma4, rule_checks], timeout_s: 40 }
  quizzer:       { chain: [gemma_26b, gemma_31b, or_gemma_26b, or_laguna, cached_questions] }
  # Fills small JSON diagram specs (code draws the SVG). deterministic_only = no spec, the chapter simply ships without that visual.
  editor:        { chain: [gemma_31b, gemma_26b, or_gemma_31b, sarvam_gemma4, no_change], timeout_s: 40 }   # proposes course edits; code validates every operation
  ocr:           { chain: [gemma_31b, gemma_26b, or_gemma_31b, text_only], timeout_s: 45 }   # vision transcription of pages with no text layer
  illustrator:   { chain: [gemma_26b, gemma_31b, sarvam_gemma4, deterministic_only], timeout_s: 25 }
  diagnoser:     { chain: [gemma_26b, or_gemma_26b, exact_match], timeout_s: 20 }    # new misconception labels (decisions only pick known ones)
  rewriter:      { chain: [gemma_26b, gemma_31b, or_gemma_26b, insert_review_step] }
  companion:     { chain: [gemma_26b, gemma_31b, or_gemma_26b, template_message] }
  companion_indic: { chain: [sarvam_105b, gemma_31b, template_message] }
  doubt:         { chain: [gemma_26b, gemma_31b, or_gemma_26b, template_answer] }
  doubt_indic:   { chain: [sarvam_105b, gemma_31b, template_answer] }
  # Every gate (relevance, diagnosis, page health, claim support, ...) asks these in ONE batched call per provider:
  decisions:     { chain: [jev, jev_or, mercury_decide, gemma_26b], timeout_s: 15 }
  # "<role>_indic" is used automatically when the student's language is not English.

services:
  speech_to_text: { chain: [sarvam_stt, sarvam_stt_v3, text_only_mode] }
  text_to_speech: { chain: [sarvam_tts, sarvam_tts_v3, no_audio] }
  translate:      { chain: [sarvam_tr, gemma_26b] }

# Non-model steps referenced in chains (implemented in code, never call a model):
#   text_only, linear_path, cached_lesson, rule_checks, cached_questions, exact_match,
#   insert_review_step, template_message, text_only_mode, no_audio, template_answer, search_order
